<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pat contacts</title>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<link rel="stylesheet" href="contacts.css">
</head>
<body>
<main id="contacts">
  <div id="paper-grain" aria-hidden="true"></div>
  <div id="content">
    <div id="topbar"><span>Pat</span><button id="close" type="button" aria-label="Close contacts">×</button></div>
    <header><h1>Contacts</h1><button id="add-open" class="pill primary" type="button">+ Add contact</button></header>
    <section id="list-view">
      <div id="columns"><span>Your people</span><span>Who answers</span></div>
      <ul id="list" class="scroll" aria-label="Contacts"></ul>
      <p id="empty" hidden>No contacts yet. Add someone you know.</p>
      <p id="hint"><strong>Ask</strong> shows your note. <strong>AI</strong> answers for you. <strong>Me</strong> lets your phone ring.</p>
      <footer id="count" aria-live="polite">0 contacts</footer>
    </section>
    <form id="editor" hidden>
      <div class="editor-fields scroll">
        <h2 id="editor-title">Add contact</h2>
        <label>Name<input id="name" type="text" maxlength="100" required autocomplete="off"></label>
        <label>Phone number<input id="number" type="tel" required autocomplete="off" placeholder="+country code and number"></label>
        <label>When they call<select id="answer"><option value="ask">Ask me each time</option><option value="ai">Let AI answer</option><option value="me">Let my phone ring</option></select></label>
        <p id="problem" role="alert" hidden></p>
      </div>
      <footer id="editor-buttons" class="editor-footer"><button id="remove" class="pill danger" type="button" hidden>Remove contact</button><span class="spacer"></span><button id="cancel" class="pill" type="button">Cancel</button><button id="save" class="pill primary" type="submit">Add contact</button></footer>
      <footer id="confirm" class="editor-footer" role="alertdialog" aria-labelledby="confirm-text" hidden><span id="confirm-text"></span><span class="spacer"></span><button id="keep" class="pill" type="button">Keep</button><button id="confirm-remove" class="pill danger" type="button">Remove</button></footer>
    </form>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const RULES = [['ask', 'Ask'], ['ai', 'AI'], ['me', 'Me']];
let bridge = null;
let editing = null;
const displayNumber = number => /^\d+$/.test(number) ? '+' + number : number;

function draw(rows) {
  $('empty').hidden = rows.length > 0;
  $('list').hidden = rows.length === 0;
  $('count').textContent = rows.length + (rows.length === 1 ? ' contact' : ' contacts');
  $('list').replaceChildren(...rows.map(row => {
    const item = document.createElement('li');
    item.dataset.name = row.name;
    const who = document.createElement(row.story ? 'div' : 'button');
    who.className = 'person';
    if (!row.story) {
      who.type = 'button';
      who.setAttribute('aria-label', 'Edit ' + row.name);
      who.onclick = () => openEditor(row);
    } else item.classList.add('story');
    const name = document.createElement('span');
    name.className = 'name'; name.textContent = row.name;
    const number = document.createElement('span');
    number.className = 'number'; number.textContent = row.story ? row.number : displayNumber(row.number);
    who.append(name, number);
    item.append(who);
    if (!row.story) {
      const choices = document.createElement('div');
      choices.className = 'choices';
      choices.setAttribute('role', 'group');
      choices.setAttribute('aria-label', 'Who answers calls from ' + row.name);
      for (const [value, text] of RULES) {
        const button = document.createElement('button');
        button.type = 'button'; button.dataset.rule = value; button.textContent = text;
        button.setAttribute('aria-pressed', String(row.rule === value));
        button.onclick = () => bridge.set_rule(row.number, value, refresh);
        choices.append(button);
      }
      item.append(choices);
    }
    return item;
  }));
}

function refresh() { bridge.rows(text => draw(JSON.parse(text))); }

function openEditor(row = null) {
  editing = row;
  $('editor-title').textContent = row ? 'Edit contact' : 'Add contact';
  $('name').value = row && row.named !== false ? row.name : '';
  $('number').value = row ? displayNumber(row.number) : '';
  $('answer').value = row?.rule || 'ask';
  $('save').textContent = row ? 'Save contact' : 'Add contact';
  $('remove').hidden = !row;
  askToRemove(false);
  $('problem').hidden = true;
  $('list-view').hidden = true;
  $('add-open').hidden = true;
  $('editor').hidden = false;
  $('name').focus();
}

function closeEditor() {
  $('editor').hidden = true;
  $('list-view').hidden = false;
  $('add-open').hidden = false;
  editing = null;
  refresh();
}

// Removing is asked once more, so one stray click can't delete someone.
function askToRemove(asking) {
  $('confirm').hidden = !asking;
  $('editor-buttons').hidden = asking;
  if (asking) {
    $('confirm-text').textContent = 'Remove ' + (editing && editing.named !== false ? editing.name : 'this number') + '?';
    $('keep').focus();
  }
}

function saved(problem) {
  $('save').disabled = false;
  $('confirm-remove').disabled = false;
  askToRemove(false);
  if (problem) {
    $('problem').textContent = problem;
    $('problem').hidden = false;
  } else closeEditor();
}

$('add-open').onclick = () => openEditor();
$('cancel').onclick = closeEditor;
$('close').onclick = () => bridge.close_window();
$('topbar').addEventListener('pointerdown', event => {
  if (event.button === 0 && !event.target.closest('button')) bridge.start_drag();
});
$('editor').addEventListener('submit', event => {
  event.preventDefault();
  $('save').disabled = true;
  const name = $('name').value.trim(), number = $('number').value.trim(), answer = $('answer').value;
  if (editing) bridge.update(editing.name, editing.number, name, number, answer, saved);
  else bridge.add(name, number, problem => {
    if (problem) saved(problem);
    else bridge.set_rule(number, answer, () => saved(''));
  });
});
$('remove').onclick = () => { if (editing) askToRemove(true); };
$('keep').onclick = () => askToRemove(false);
$('confirm-remove').onclick = () => {
  if (!editing) return;
  $('confirm-remove').disabled = true;
  bridge.remove(editing.name, editing.number, saved);
};
new QWebChannel(qt.webChannelTransport, channel => {
  bridge = channel.objects.bridge;
  refresh();
  window.addEventListener('focus', refresh);
});
</script>
</body>
</html>
